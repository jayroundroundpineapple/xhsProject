<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>方向二 · 留白</title>
<link rel="stylesheet" href="_kit/xhs.css"><script src="_kit/xhs.js"></script>
<style>
:root{
  --paper:#F7F4EC; --ink:#24211C; --ink2:#4F4A40; --gray:#8A8375; --line:#CFC8B8;
}
body{font-family:var(--serif)}
.v{writing-mode:vertical-rl;position:absolute}
.no{position:absolute;left:var(--m);top:90px;font:500 34px var(--serif);letter-spacing:6px;color:var(--gray)}
.seal{position:absolute;width:118px;height:118px;background:#B5342B;color:#F7EDE6;border-radius:8px;display:flex;align-items:center;justify-content:center;font:900 46px/1.05 var(--serif);letter-spacing:2px}
.rule{position:absolute;background:var(--line)}
.cover .title{right:130px;top:140px;font:900 116px/1.25 var(--serif);letter-spacing:14px;color:var(--ink);height:1080px}
.cover .sub{right:330px;top:170px;font:500 40px/1.5 var(--serif);letter-spacing:8px;color:var(--ink2);height:760px}
.cover .seal{left:130px;top:150px}
.cover .prod{position:absolute;left:120px;bottom:170px;width:400px;filter:drop-shadow(0 14px 22px rgba(60,50,30,.16))}
.cover .foot{position:absolute;left:var(--m);bottom:70px;width:560px;border-top:2px solid var(--line);padding-top:16px;font:400 32px var(--serif);color:var(--gray)}
.inner .title2{right:120px;top:150px;font:900 92px/1.3 var(--serif);letter-spacing:12px;color:var(--ink);height:1000px}
.inner .bodyv{right:300px;top:170px;font:500 44px/1.8 var(--serif);letter-spacing:6px;color:var(--ink2);height:1080px}
.inner .seal{left:140px;bottom:180px}
.inner .scene{position:absolute;left:100px;top:200px;width:420px;height:640px;object-fit:cover;filter:grayscale(.2)}
.inner .foot{position:absolute;left:var(--m);bottom:70px;width:620px;border-top:2px solid var(--line);padding-top:16px;font:400 32px var(--serif);color:var(--gray)}
</style></head><body>
<main class="xhs-deck two">
<section class="xhs-page cover" data-pageno="off">
  <div class="no">家电选购避坑 · 壹</div>
  <div class="v title">洗烘怎么选</div>
  <div class="v sub">一体，还是套装<br>先把这件事想清楚</div>
  <div class="seal">避坑</div>
  <img class="prod" src="assets/product.png" alt="真实商品主图">
  <div class="foot caption">标题写着洗烘一体，主图却标"不带烘干" · 商品图截自天猫 2026.11.16</div>
</section>
<section class="xhs-page inner">
  <div class="no">家电选购避坑 · 贰</div>
  <div class="v title2">烘干容量</div>
  <div class="v bodyv">一体标 10kg 是洗的<br>烘通常只有 6-7kg<br>洗满一桶要分两次烘<br>套装洗十烘十<br>整桶挪过去就好<br>常洗床单被套的<br>这一条就够决定了</div>
  <img class="scene" src="assets/scene.png" alt="阳台洗烘场景示意">
  <div class="seal">干货</div>
  <div class="foot caption">场景示意 · 非实拍 · 参数以官方页为准</div>
</section>
</main>
<script>XHS.number(6)</script>
</body></html>
